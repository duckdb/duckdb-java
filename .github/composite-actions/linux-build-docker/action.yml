name: 'Linux Build Docker'
description: 'Linux build in Docker'
inputs:
  docker_image:
    description: 'Docker image name'
    required: true
    default: ''

runs:
  using: "composite"
  steps:
    - name: Build
      shell: bash
      run: |
        python ./scripts/retry.py --timeout 1m -- \
          docker pull ${{ inputs.docker_image }}
        docker run                                   \
        -v.:/duckdb                                  \
        -e GEN=ninja                                 \
        -e CC='ccache gcc'                           \
        -e CXX='ccache g++'                          \
        -e CCACHE_DIR=/duckdb/ccache                 \
        -e JAVA_HOME=/usr/lib/jvm/java-1.8.0-openjdk \
        ${{ inputs.docker_image }}                   \
        bash -c "
          set -e
          cat /etc/os-release
          python3 /duckdb/scripts/retry.py --timeout 2m -- \
            dnf install -y           \
            ccache                   \
            java-1.8.0-openjdk-devel \
            ninja-build
          make -C /duckdb release
        "
